model:
  img_size: 224
  patch_size: 16
  in_chans: 3
  embed_dim: 1024 # for llava, to match the hidden size of vision tower
  num_heads: 6
  mlp_ratio: 4.0
  dropout: 0.05
  num_classes: 1000
  num_smb: 8 #16
  cls_head_type: cls_token
  num_blocks: 12
  drop_path_rate: 0.07 # 0.1

  # # Layer schedule: 3 compressive layers after blocks 1, 3, 5
  # layer_schedule:
  #   - type: block
  #     block_idx: 0
  #   - type: block
  #     block_idx: 1

  #   - type: compress     # 1st compressive layer after block 1
  #     compress_idx: 0
      
  #   - type: block
  #     block_idx: 2
  #   - type: block
  #     block_idx: 3

  #   - type: compress     # 2nd compressive layer after block 3
  #     compress_idx: 1

  #   - type: block
  #     block_idx: 4
  #   - type: block
  #     block_idx: 5

  #   - type: compress     # 3rd compressive layer after block 5
  #     compress_idx: 2
      
  #   - type: block
  #     block_idx: 6
  #   - type: block
  #     block_idx: 7
  #   - type: block
  #     block_idx: 8
  #   - type: block
  #     block_idx: 9
  #   - type: block
  #     block_idx: 10
  #   - type: block
  #     block_idx: 11

# ----------------------------
# Compressive layer settings
# ----------------------------
compressive:
  num_compress_layers: 2
  layer_type: infonce
  reuse_decode_for_hardneg: true
  fill_decode_for_hardneg: true
  nce_temperature: 0.07
  num_hard_neg: 4  
  num_easy_neg: 16 
  T0: 16
  mlp_ratio: 2.0                     # MLP ratio for compressive layers (default 2.0; model.mlp_ratio=4.0 for blocks)
  decoder_dim_multiplier: 0.5        # Decoder input projection scale in (0,1]; 1.0 = no projection
  lambda_recon: 0.001                 # 0.01 used in llava pretrain,reconstruction loss weight (used when ramp disabled or as default for initial/final)
  lambda_recon_ramp_pretrain: false   # pretrain-only: when true use initial_pretrain -> ramp -> final_pretrain
  #lambda_recon_initial_pretrain: 0.0 # pretrain-only: value until recon_ramp_start_pretrain
  #lambda_recon_final_pretrain: 0.05  # pretrain-only: value at recon_ramp_end_pretrain and after
  #recon_ramp_start_pretrain: 30      # pretrain-only: epoch when linear ramp starts
  #recon_ramp_end_pretrain: 70        # pretrain-only: epoch when ramp reaches final
  # residual_norm_type: l1            # "l2" or "l1" - must match layer computation
  smb_mhsa: true                     # If true, add SMB-only self-attention (smb<->smb) after MLP, before decoding
  drop_path_rate: 0.07               # Stochastic depth for compressive layers only (separate from model.drop_path_rate for blocks)
  keep_ratio: [0.75, 0.426]     # target keep ratio per layer; 1.0 = no drop
  #keep_ratio_target_epoch: 25        # 0 = use keep_ratio from epoch 0; >0 = linear ramp from 1.0 to keep_ratio by this epoch
                                      # When > optim.warmup_epochs: 2-phase LR (warmup -> hold max LR until this epoch -> cosine)
  return_residual_tokens: true     # true (default): pass residuals to next layer; false: pass original kept tokens
  recon_loss_dropped_only: false   # false (default): recon loss over all tokens; true: only over dropped tokens
  pass_cls_token: False            # optional, default: false in llava